name: "Bug"
description: "不具合の報告から調査・修正・確認完了まで管理する"
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        不具合の内容を、再現可能な最小情報で記載してください。

  - type: "textarea"
    id: "summary"
    attributes:
      label: "事象"
      description: "発生している問題を簡潔に記載してください。"
      placeholder: "例: 保存ボタンを押しても変更内容が反映されない"
    validations:
      required: true

  - type: "dropdown"
    id: "priority"
    attributes:
      label: "優先度"
      description: "業務影響に応じて選択してください。Critical: 業務停止または全ユーザー影響 / High: 主要機能停止または50%以上に影響 / Medium: 回避策ありの一部機能影響 / Low: 限定的な影響"
      options:
        - "Critical"
        - "High"
        - "Medium"
        - "Low"
    validations:
      required: true

  - type: "textarea"
    id: "steps-to-reproduce"
    attributes:
      label: "再現手順"
      description: "対象画面、入力値、操作順、実行回数を含めて、第三者が同じ条件で再現できるように記載してください。"
      placeholder: |
        1. 設定画面を開く
        2. 表示名に「テスト太郎」を入力する
        3. 保存ボタンを1回押す
        4. 一覧画面へ戻る
        5. 表示名が更新されていないことを確認する
    validations:
      required: true

  - type: "textarea"
    id: "expected-behavior"
    attributes:
      label: "期待される動作"
      description: "本来どう動くべきかを、画面表示、メッセージ、データ更新結果を含めて記載してください。"
      placeholder: "例: 保存完了メッセージが表示され、一覧画面に変更内容が反映される"
    validations:
      required: true

  - type: "textarea"
    id: "actual-behavior"
    attributes:
      label: "実際の動作"
      description: "実際に発生した結果を、表示メッセージ、挙動、データ状態を含めて記載してください。"
      placeholder: "例: 保存完了メッセージは表示されるが、一覧画面に変更内容が反映されない"
    validations:
      required: true

  - type: "textarea"
    id: "environment"
    attributes:
      label: "環境情報"
      description: "OS、ブラウザ、アプリ版、対象ブランチ、発生環境を記載してください。"
      placeholder: "例: Windows 11 / サーバー / クライアントPC"
    validations:
      required: true

  - type: "textarea"
    id: "evidence"
    attributes:
      label: "証跡"
      description: "ログ、スクリーンショット、エラーメッセージ、関連URLがあれば記載してください。"
      placeholder: |
        例:
        - エラーメッセージ: 500 Internal Server Error
        - ログ: save() 実行時に NullReferenceException
        - URL: /settings/profile

  - type: markdown
    attributes:
      value: |
        以下は調査・修正の進行にあわせて追記する任意項目です。

  - type: "dropdown"
    id: "response-phase"
    attributes:
      label: "対応フェーズ"
      description: "現在の対応状況を選択してください。"
      options:
        - "調査中"
        - "原因特定済み"
        - "修正中"
        - "修正済み（確認待ち）"
        - "確認完了"

  - type: "textarea"
    id: "root-cause"
    attributes:
      label: "原因"
      description: "原因が特定できたら記載してください。未特定の場合は『調査中』と記載してください。"
      placeholder: "例: API側のバリデーション条件が不足しており、null値で例外が発生"

  - type: "textarea"
    id: "fix-plan"
    attributes:
      label: "対応内容"
      description: "実施した修正内容、または実施予定の修正方針を記載してください。"
      placeholder: |
        例:
        - API入力値チェックを追加
        - 例外時のエラーハンドリングを修正
        - 回帰防止テストを追加

  - type: "textarea"
    id: "verification-result"
    attributes:
      label: "確認結果"
      description: "修正後の確認結果を記載してください。未確認の場合は『未確認』と記載してください。"
      placeholder: |
        例:
        - 再現手順で再発しないことを確認
        - 関連機能に影響がないことを確認
        - 本番確認は未実施
